# Настройки бота. Меняйте только значения справа от «=».
# Строки, которые начинаются с #, это пояснения: бот их не читает.
# Доли пишутся десятичной дробью: 0.15 = 15%.

[bank]
# Бюджет бумажной торговли в TON. Ваш Myth Mask (модель Giggle Grief) на рынке стоит от 11,5 TON:
# если выставить его за ~11,15 TON, после комиссии 10% на руки придёт около 10 TON.
bank_ton = 10.0
# Сколько подарков бот может держать одновременно.
max_open_positions = 1
# Самая высокая цена одной покупки, TON. Дешевле 7 TON продать за TON нельзя (правило Telegram).
max_buy_ton = 10.0

[fees]
# Какую долю цены получает продавец при продаже за TON.
# Telegram сам сообщает в настройках: 90% при продаже за TON, 80% за звёзды.
seller_share_ton = 0.90

[rules]
# Покупать, только если продажа даст безубыток плюс этот запас (0.15 = 15%).
min_margin = 0.15
# На сколько дешевле самого дешёвого похожего лота мы выставим подарок (0.03 = 3%).
undercut = 0.03
# Сколько других похожих лотов должно быть на продаже, чтобы им верить.
min_other_listings = 2
# Снижение цены раз в сутки (0.05 = 5%), но никогда не ниже безубытка.
daily_price_step = 0.05
# Через сколько дней не проданный подарок продаётся по рынку, даже в минус.
max_hold_days = 7
# Фоны, за которые доплачивают: с ними бот сравнивает отдельно.
premium_backdrops = ["Black", "Onyx Black"]

[scan]
# Пауза между проходами по рынку, минут.
interval_minutes = 20
# Пауза между запросами к Telegram, секунд. Не ставьте меньше 1.
request_pause_sec = 1.5
# Сколько самых дешёвых лотов смотреть в каждой коллекции.
cheapest_per_collection = 10
# Смотреть только эти коллекции. Пусто = все.
# Пример: collections = ["Plush Pepe", "Snoop Dogg"]
collections = []

[report]
# Во сколько часов по времени компьютера присылать сводку в «Избранное».
daily_summary_hour = 21
